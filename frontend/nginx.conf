limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=lookup:10m rate=30r/m;

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;

    # Replaces user-controlled identity headers. Keep backend ports private.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location = /api/auth/login/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8000;
    }
    location = /api/lookups/ {
        limit_req zone=lookup burst=10 nodelay;
        proxy_pass http://backend:8000;
    }
    location /api/ { proxy_pass http://backend:8000; }
    location = /api/batches/upload/ {
        client_max_body_size 101m;
        client_body_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass http://backend:8000;
    }
    location /protected-batch-exports/ {
        internal;
        alias /var/www/batch-data/exports/;
        default_type text/csv;
        sendfile on;
    }
    location /admin/ { proxy_pass http://backend:8000; }
    location /static/ { alias /var/www/django-static/; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
