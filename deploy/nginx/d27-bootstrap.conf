# Install into /etc/nginx/sites-available/d27.
# Only used until the first certificate has been issued.
server {
    listen 80;
    listen [::]:80;
    server_name d27desk.peoplegraph.co;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
