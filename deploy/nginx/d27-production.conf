# Host Nginx for d27desk.peoplegraph.co; checkout: /srv/D27_lookup_endp.
# Install as a site included inside nginx.conf's http {} context.
# Supports direct DNS or Cloudflare proxying with SSL mode Full (strict).
# Cloudflare ranges verified 2026-10-28: https://www.cloudflare.com/ips/
map $uri $d27_cache_control {
    default "no-cache";
    ~^/(assets|static)/ "";
    ~^/(api|admin|protected-batch-exports)(/|$) "private, no-store";
}
log_format d27_proxy '$remote_addr peer=$realip_remote_addr [$time_local] '
                     '"$request_method $uri $server_protocol" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=d27_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=d27_lookup:10m rate=30r/m;


server {
    listen 80;
    listen [::]:80;
    server_name d27desk.peoplegraph.co;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://d27desk.peoplegraph.co$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name d27desk.peoplegraph.co;
    if ($host != d27desk.peoplegraph.co) { return 444; }

    # Trust visitor-IP headers only when the TCP peer is Cloudflare.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    access_log /var/log/nginx/d27.access.log d27_proxy;
    error_log /var/log/nginx/d27.error.log warn;

    ssl_certificate /etc/letsencrypt/live/d27desk.peoplegraph.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/d27desk.peoplegraph.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:D27TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    root /srv/D27_lookup_endp/var/www/frontend;
    index index.html;
    client_max_body_size 16k;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $d27_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;

    # Replace client-supplied forwarding headers. Gunicorn is loopback-only.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host d27desk.peoplegraph.co;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_hide_header Strict-Transport-Security;

    location = /api/auth/login/ {
        limit_req zone=d27_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18000;
    }
    location = /api/lookups/ {
        limit_req zone=d27_lookup burst=10 nodelay;
        proxy_pass http://127.0.0.1:18000;
    }
    location /api/ { proxy_pass http://127.0.0.1:18000; }
    location = /api/batches/upload/ {
        client_max_body_size 101m;
        client_body_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:18000;
    }
    location /protected-batch-exports/ {
        internal;
        alias /srv/D27_lookup_endp/var/data/batches/exports/;
        default_type text/csv;
        sendfile on;
    }
    location /admin/ { proxy_pass http://127.0.0.1:18000; }
    location /static/ { alias /srv/D27_lookup_endp/var/www/static/; }
    location /assets/ { expires 1y; try_files $uri =404; }
    # The SPA fallback must not make arbitrary dotfiles public.
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
